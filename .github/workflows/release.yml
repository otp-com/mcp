name: Release
# Manual release: enter a version, it bumps package.json, publishes to npm, then tags and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: an exact number (0.2.0) or a bump keyword (patch, minor, major)'
        required: true
        type: string
permissions:
  contents: write # push the version commit and tag, create the release
  id-token: write # npm provenance: links the published package to this exact commit
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than the one bundled with Node 24.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Bump version and create tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(npm version "$VERSION" -m 'release: v%s')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Published before the tag is pushed: a failed publish must not leave a release tag on main.
      # Auth is the job's OIDC token via npm trusted publishing, so there is no NPM_TOKEN to leak.
      - run: npm publish --provenance --access public

      - run: git push --follow-tags origin HEAD:main

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --generate-notes
