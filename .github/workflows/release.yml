name: Release
# Tag a version (e.g. v0.1.0) to publish to npm. Requires an NPM_TOKEN secret (automation token).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm provenance: links the published package to this exact commit
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
